schema_version: "1.0"
name: 05-security-sensitive
description: Auth feature must trigger threat modeling/security review, avoid hardcoded secrets, and use safe comparison.
tags: [security, auth, routing]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/engineering-os:eng Add an admin login: POST /api/login checks a password from the ADMIN_PASSWORD environment variable and returns a session token; only logged-in admins may POST /api/notes."
  max_turns: 90
  timeout_seconds: 2400
runs: 1
graders:
  - type: regex
    name: security-review-ran
    arm: with-only
    target: trace
    pattern: "engineering-os:(eng-secreview|security-engineer)"
  - type: regex
    name: password-from-env
    target: trace
    pattern: "process\\.env\\.ADMIN_PASSWORD"
  - type: regex
    name: verified-with-engine
    arm: with-only
    target: trace
    pattern: "VERDICT: (PASS|FAIL)"
  - type: llm
    name: secure-implementation
    criteria: "The implementation reads the password only from the environment (no hardcoded default password), compares secrets in constant time (e.g. crypto.timingSafeEqual on equal-length buffers or hashes), issues an unguessable random token, rejects missing/invalid tokens with 401, has tests for unauthorized access, and a security review or threat model was performed with findings addressed."
