# Engineering OS capability registry — the single source of truth for staffing, review, and gates.
# Read by scripts/eng-route.mjs, hooks/scripts/gates.mjs, scripts/eng-plan-check.mjs, and the validator.
# Capabilities are activated on demand; several share one agent (fewer, deeper contexts).
# tools / max_turns MUST equal the agent's frontmatter, and the agent's `model` MUST equal tiers[tier]
# (validator-enforced). Budget impact is derived from tier x max_turns (no separate field).
# topology: Team Topologies type - stream (value delivery), enabling (specialist support),
#           platform (shared capability), subsystem (complicated subsystem).
# reviewer_gate: the capability is an independent reviewer whose PASS the completion gate requires
#                when the class budget or a risk flag names it; `skill` is the skill that runs it.
version: 2

# Model tiers → Claude Code model aliases. Remap aliases with ANTHROPIC_DEFAULT_{HAIKU,SONNET,OPUS}_MODEL;
# override every subagent with CLAUDE_CODE_SUBAGENT_MODEL; escalate one call with the Agent `model` parameter.
tiers:
  low: haiku
  medium: sonnet
  high: opus

# Intake risk dimensions; risk = the highest score (eng-route --dims).
risk_dimensions: [blast-radius, reversibility, data-sensitivity, external-exposure, production-impact, dependency-uncertainty, architectural-uncertainty, security-sensitivity, operational-criticality]

# Lifecycle gates the completion gate enforces, by class. Skip only with `Skipped: <gate> (<reason>)` in status.md Now.
gates:
  acceptance_criteria: [SMALL, MEDIUM, LARGE, CRITICAL]
  plan_complete: [MEDIUM, LARGE, CRITICAL]

# Per-class budgets. The orchestrator (main session) is always the owner; "max_agents" counts spawned subagents.
# max_impl_files / max_areas: ceiling on changed non-test source files and top-level areas (first path segment);
# the Stop gate blocks a declared class whose diff exceeds them (reclassify upward).
budgets:
  TRIVIAL:
    max_agents: 0
    concurrency: 0
    research: none
    retries: 1
    verify: targeted
    reviewers: []
    max_impl_files: 1
    max_areas: 1
  SMALL:
    max_agents: 1
    concurrency: 1
    research: none
    retries: 2
    verify: standard
    reviewers: [code-review]
    max_impl_files: 3
    max_areas: 1
  MEDIUM:
    max_agents: 4
    concurrency: 2
    research: quick
    retries: 2
    verify: standard
    reviewers: [scope-judge, code-review]
    reviewers_if_flagged: [adversarial-qa] # PROC-6: MEDIUM work with any risk flag also gets adversarial QA
  LARGE:
    max_agents: 8
    concurrency: 4
    research: standard
    retries: 2
    verify: full
    reviewers: [scope-judge, code-review, adversarial-qa]
  CRITICAL:
    max_agents: 10
    concurrency: 3
    research: standard
    retries: 2
    verify: full
    reviewers: [scope-judge, code-review, appsec, adversarial-qa]

# Risk flag -> capabilities that become mandatory (in addition to the class reviewers).
risk_requirements:
  auth: [threat-modeling, appsec]
  payments: [threat-modeling, appsec, privacy]
  pii: [privacy, appsec]
  secrets: [appsec]
  prod-data: [database, release]
  infra: [platform-engineering, appsec]
  external-input: [appsec]
  new-dependency: [supply-chain]
  ai: [ai-ml]
  ui: [ux]
  irreversible: [architecture]

# Evidence each risk flag obliges the final report to show (one row per flag in the acceptance table).
risk_deliverables:
  auth: "threat model; constant-time secret comparison; unguessable tokens; tests proving unauthenticated and wrong-credential requests are rejected"
  payments: "threat model; idempotency; amounts in integer minor units; tests for failure and retry paths"
  pii: "data inventory; minimization; access control tests; no PII in logs"
  secrets: "secrets only from environment or secret store; none in code, logs, fixtures, or commits (eng-verify SECRETS PASS)"
  prod-data: "migration plan with rollback; backup verified; human approval recorded"
  infra: "plan or diff of infra change; least privilege; rollback path"
  external-input: "validation at the boundary; size limits; tests for malformed input"
  new-dependency: "justification; license; maintenance and advisory check; pinned version"
  ai: "labeled eval set (typical, edge, adversarial incl. prompt injection) with measured score reported; output validated against an allowlist; unit tests mock the model"
  ui: "loading, empty, error, and success states; keyboard and screen-reader access (labels, aria-live for status); how it was checked"
  irreversible: "ADR with alternatives; human approval recorded"

# Changed non-test source paths that imply a risk flag (case-insensitive regex on the repo-relative path,
# matched per path segment). The completion gate requires each implied flag to be declared in status.md
# Now (`Flags:`) or waived with `Waived: <flag> (<reason>)`. new-dependency is implied by the verifier's
# manifest diff, not by paths. Flags without an entry here are judgment-only.
risk_paths:
  auth: '(^|[/._-])(auth|authn|authz|authenticat\w*|authoriz\w*|login|logout|signin|signup|passwords?|passwd|jwt|oauth2?|oidc|saml|sso|credentials?|rbac|acl)([/._-]|$)|(^|/)sessions?(\.\w+)?(/|$)'
  payments: '(^|[/._-])(payments?|billing|checkout|invoices?|stripe|paypal|subscriptions?|refunds?)([/._-]|$)'
  pii: '(^|[/._-])(pii|gdpr|ssn|kyc|personal[-_]?data)([/._-]|$)'
  secrets: '(^|[/._-])(secrets?|vault|kms)([/._-]|$)|(^|/)\.env\.(example|sample|template)$'
  prod-data: '(^|/)(migrations?|seeds?)/|(^|/)schema\.(sql|prisma)$'
  infra: '(^|/)(dockerfile|docker-compose[^/]*|compose\.ya?ml)$|^\.github/workflows/|(^|/)(terraform|infra|k8s|kubernetes|helm|pulumi|ansible)/|\.tf$'
  ai: '(^|[/._-])(prompts?|llm|embeddings?|openai|anthropic)([/._-]|$)'
  ui: '\.(tsx|jsx|vue|svelte|astro|css|scss|sass|less|html)$'

