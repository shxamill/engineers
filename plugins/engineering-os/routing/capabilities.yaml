# Engineering OS capability registry (machine-readable; read by scripts/eng-route.mjs and the validator).
# Capabilities are activated on demand; several share one agent (fewer, deeper contexts).
# tools / model / max_turns MUST equal the agent's frontmatter (validator-enforced).
# topology: Team Topologies type - stream (value delivery), enabling (specialist support),
#           platform (shared capability), subsystem (complicated subsystem).
version: 1

# Per-class budgets. The orchestrator (main session) is always the owner; "max_agents" counts spawned subagents.
budgets:
  TRIVIAL:
    max_agents: 0
    concurrency: 0
    research: none
    retries: 1
    verify: targeted
    reviewers: []
  SMALL:
    max_agents: 1
    concurrency: 1
    research: none
    retries: 2
    verify: standard
    reviewers: [code-review]
  MEDIUM:
    max_agents: 4
    concurrency: 2
    research: quick
    retries: 2
    verify: standard
    reviewers: [scope-judge, code-review]
  LARGE:
    max_agents: 8
    concurrency: 4
    research: standard
    retries: 2
    verify: full
    reviewers: [scope-judge, code-review, adversarial-qa]
  CRITICAL:
    max_agents: 10
    concurrency: 3
    research: standard
    retries: 2
    verify: full
    reviewers: [scope-judge, code-review, appsec, adversarial-qa]

# Risk flag -> capabilities that become mandatory (in addition to the class reviewers).
risk_requirements:
  auth: [threat-modeling, appsec]
  payments: [threat-modeling, appsec, privacy]
  pii: [privacy, appsec]
  secrets: [appsec]
  prod-data: [database, release]
  infra: [platform-engineering, appsec]
  external-input: [appsec]
  new-dependency: [supply-chain]
  ai: [ai-ml]
  ui: [ux]
  irreversible: [architecture]

capabilities:
  - id: product-management
    agent: product-manager
    group: product
    topology: stream
    purpose: Problem, users, outcomes, scope, requirements, acceptance criteria
    triggers: [requirements, user story, acceptance criteria, mvp, scope, product, saas, feature request]
    risk_triggers: []
    classes: [MEDIUM, LARGE, CRITICAL]
    inputs: [request, research.md]
    outputs: [product.md, requirements.md]
    tools: [Read, Grep, Glob, Write, Edit, WebSearch, WebFetch]
    scopes: ["docs/engineering/**"]
    model: sonnet
    max_turns: 30
    parallel: false
    depends: []
    reviewers: []
    security: none
  - id: product-research
    agent: researcher
    group: product
    topology: enabling
    purpose: Evidence for decisions (technical, domain, competitive)
    triggers: [research, compare, which library, best practice, competitor, market, evaluate options]
    risk_triggers: []
    classes: [SMALL, MEDIUM, LARGE, CRITICAL]
    inputs: [decision question]
    outputs: [research.md entry]
    tools: [Read, Grep, Glob, WebSearch, WebFetch, Write, Edit]
    scopes: ["docs/engineering/research.md"]
    model: sonnet
    max_turns: 30
    parallel: true
    depends: []
    reviewers: []
    security: none
  - id: product-analytics
    agent: product-manager
    group: product
    topology: enabling
    purpose: Success metrics, event definitions, outcome signals
    triggers: [metric, analytics, conversion, retention, adoption, kpi, success signal]
    risk_triggers: [pii]
    classes: [MEDIUM, LARGE, CRITICAL]
    inputs: [requirements.md]
    outputs: [requirements.md#metrics]
    tools: [Read, Grep, Glob, Write, Edit, WebSearch, WebFetch]
    scopes: ["docs/engineering/**"]
    model: sonnet
    max_turns: 30
    parallel: true
    depends: [product-management]
    reviewers: []
    security: low
  - id: ux
    agent: ux-designer
    group: design
    topology: stream
    purpose: Flows, information architecture, states, accessibility
    triggers: [ux, user flow, screen, page, dashboard, onboarding, form, redesign, usability]
    risk_triggers: []
    classes: [MEDIUM, LARGE, CRITICAL]
    inputs: [requirements.md]
    outputs: [ux.md]
    tools: [Read, Grep, Glob, Write, Edit, WebFetch]
    scopes: ["docs/engineering/ux.md"]
    model: sonnet
    max_turns: 30
    parallel: false
    depends: [product-management]
    reviewers: []
    security: none
  - id: ui-visual
    agent: ux-designer
    group: design
    topology: stream
    purpose: Visual hierarchy, layout, typography, responsive polish
    triggers: [ui, visual, layout, styling, theme, typography, look and feel, polish]
    risk_triggers: []
    classes: [SMALL, MEDIUM, LARGE]
    inputs: [ux.md]
    outputs: [ux.md#visual]
    tools: [Read, Grep, Glob, Write, Edit, WebFetch]
    scopes: ["docs/engineering/ux.md"]
    model: sonnet
